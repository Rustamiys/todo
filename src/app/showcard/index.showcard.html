<app-not-found></app-not-found>
<div class="col-item">
  <div style="height: 800px; background-color:#d7d7d7;">
    <br>
    <div class="form-container">
      <div class="form-group">
        <dx-text-box 
          [(value)]="task.priority"
          [readOnly]="true"
          >
        </dx-text-box>
        <label class="required">Приоритет *</label>
      </div>
    
      <div class="form-item">
        <dx-text-box 
          [(value)]="task.task"
          [readOnly]="true"
          >
        </dx-text-box>
        <label class="required">Задача *</label>
      </div>
      
    
      <div class="form-group-row">
        <div class="form-group">
          <dx-date-box
            type="date"
            [(value)]="task.startDate"
            [displayFormat]="'dd.MM.yyyy'"
            [inputAttr]="{ 'aria-label': 'Date' }"
            [readOnly]="true"
          >
          </dx-date-box>
          <label class="required">Дата начала *</label>
        </div>
    
        <div class="form-group">
          <dx-date-box
            type="date"
            [(value)]="task.endDate"
            [displayFormat]="'dd.MM.yyyy'"
            [inputAttr]="{ 'aria-label': 'Date' }"
            [readOnly]="true"
          >
          </dx-date-box>
          <label class="required">Дата завершения *</label>
        </div>
      </div>
    
      <div class="form-group">
        <dx-text-box 
          [(value)]="task.status"
          [readOnly]="true"
          >
        </dx-text-box>
        <label class="required">Статус *</label>
      </div>
    
      <div class="form-group">
        <h3>Участники *</h3>
        <br>
        <dx-data-grid 
          [(dataSource)]="task.participants" 
          [showBorders]="true" 
          [paging]="{ pageSize: 5 }"
          [allowColumnReordering]="true">        
        <dxo-filter-row [visible]="true" [applyFilter]="true"></dxo-filter-row>      
        <dxi-column 
          dataField="name" 
          caption="Список участников события">
        </dxi-column>
      </dx-data-grid>
</div>
