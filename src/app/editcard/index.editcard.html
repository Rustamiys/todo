<div class="col-item">
  <div class="row-item" style="height: 30px;background-color: white; justify-content: space-between;">
    <dx-button
      icon="back"
      stylingMode="text"
      text="НАЗАД"
      type="normal"
      [width]="150"
      [height]="50"
      (onClick)="goToHomePage()">
    </dx-button>
  </div>
  <div style="height: 800px; background-color:#d7d7d7;">
    <br>
    <div class="form-container">
      <div class="form-group">
        <dx-select-box 
          [items]="priorities" 
          placeholder="Выберите значение ...." 
          [(value)]="selectedPriority" 
          [showClearButton]="true">
        </dx-select-box>
        <div *ngIf="!selectedPriority" class="error-message">
          Поле не может быть пустым
        </div>
        <label class="required">Приоритет *</label>
      </div>
    
      <div class="form-item">
        <dx-text-box 
          placeholder="Введите значение ...." 
          [(value)]="taskName" 
          [isValid]="taskName && taskName.trim().length > 0 ? true : false"
          [validationMessageMode]="'always'"
          [class.invalid]="!taskName || !taskName.trim().length">
        </dx-text-box>
        <div *ngIf="!taskName || !taskName.trim().length" class="error-message">
          Поле не может быть пустым
        </div>
        <label class="required">Задача *</label>
      </div>
      
    
      <div class="form-group-row">
        <div class="form-group">
          <dx-date-box
            type="date"
            [(value)]="start_date"
            [displayFormat]="'dd.MM.yyyy'"
            [inputAttr]="{ 'aria-label': 'Date' }"
          >
          </dx-date-box>
          <div *ngIf="start_date && finish_date && start_date > finish_date" class="error-message">            
            Дата начала не может быть позже даты завершения
          </div>
          <div *ngIf="!start_date">
            <label class="error-message">Дата начала должна быть заполнена*</label>
          </div>
          <label class="required">Дата начала *</label>
        </div>
    
        <div class="form-group">
          <dx-date-box
            type="date"
            [(value)]="finish_date"
            [displayFormat]="'dd.MM.yyyy'"
            [inputAttr]="{ 'aria-label': 'Date' }"
          >
          </dx-date-box>
          <div *ngIf="start_date && finish_date && start_date > finish_date" class="error-message">            
            Дата начала не может быть позже даты завершения
          </div>
          <div *ngIf="!finish_date">
            <label class="error-message">Дата завершения должна быть заполнена*</label>
          </div>
          <label class="required">Дата завершения *</label>
        </div>
      </div>
    
      <div class="form-group">
        <dx-select-box 
          [items]="statuses" 
          placeholder="Выберите значение ...." 
          [(value)]="selectedStatus" 
          [showClearButton]="true">
        </dx-select-box>
        <div *ngIf="!selectedStatus" class="error-message">
          Поле не может быть пустым
        </div>
        <label class="required">Статус *</label>
      </div>
    
      <div class="form-group">
        <h3>Участники *</h3>
        <div class="row-item" style="justify-content: flex-end;">
          <dx-button
            stylingMode="outlined"
            text="ДОБАВИТЬ УЧАСТНИКА"
            type="normal"
            [width]="200"
            (onClick)="openPopup()"
            >
          </dx-button>
        </div>
        <br>
        <dx-data-grid 
          [(dataSource)]="participants" 
          [showBorders]="true" 
          [paging]="{ pageSize: 5 }"
          [allowColumnReordering]="true">
      
        <dxo-editing 
          mode="cell"  
          [allowDeleting]="true">
        </dxo-editing>
      
        <dxi-column 
          dataField="name" 
          caption="Список участников события">
        </dxi-column>
      </dx-data-grid>
        <div *ngIf="!participants" class="error-message">
          Должны быть выбраны участники
        </div>
        <dx-popup 
          [(visible)]="isPopupVisible"
          [width]="400"
          [height]="500"
          [showTitle]="true"
          title="Добавление участника"
          [dragEnabled]="true"
          [closeOnOutsideClick]="true">  
        <div>
          <dx-button
            text="СОЗДАТЬ УЧАСТНИКА"
            [width]="400"
            (onClick)="openCreateParticipantPopup()"
            >
          </dx-button>
          <dx-text-box
            placeholder="Поиск по участникам..."
            [(value)]="searchTerm"
            (onValueChanged)="filterParticipants($event)">
          </dx-text-box>
          <ul>
            <li 
              *ngFor="let participant of filteredParticipants" 
              (click)="addParticipant(participant)"
              class="participant-item">
              {{ participant.name }}
            </li>
          </ul>
        </div>        
      </dx-popup>
      <dx-popup 
        [(visible)]="isCreateParticipantPopupVisible"
        [width]="400"
        [height]="300"
        [showTitle]="true"
        title="Создание участника"
        [dragEnabled]="true"
        [closeOnOutsideClick]="true">

        <div>
          <label>Имя участника:</label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="Введите имя" 
            [(ngModel)]="newParticipantName" 
          />
          <button (click)="createParticipant()" class="btn btn-success mt-2">
            Создать
          </button>
          <button (click)="isCreateParticipantPopupVisible = false" class="btn btn-secondary mt-2">
            Отмена
          </button>
        </div>
      </dx-popup>
      </div>
    </div>    
  </div>

  <div class="row-item" style="justify-content: flex-end; height: 30px;background-color: white;">
    <dx-button
            stylingMode="outlined"
            text="ОТМЕНИТЬ"
            type="normal"
            [width]="120"
          >
    </dx-button>
    <dx-button
          stylingMode="contained"
          text="СОХРАНИТЬ"
          type="default"
          [width]="120"
          (onClick)="save()"
        >
    </dx-button>
  </div>

</div>
